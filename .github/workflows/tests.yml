# Тэсты пры кожнай адпраўцы на GitHub: Python (unittest) разам з тэстамі інтэрфейсу (Node.js + jsdom).
# Windows — як на камп'ютары аўтара; пояс сервера UTC, а не мясцовы — тэсты ад яго не залежаць.
name: Тэсты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Залежнасці
        run: |
          python -m pip install -r requirements.txt
          npm ci

      - name: Python- і JS-тэсты
        env:
          PYTHONUTF8: "1"
          REQUIRE_JS_TESTS: "1"  # тут тэсты інтэрфейсу не прапускаюцца: калі Node.js або jsdom няма — гэта памылка
        run: python -B -m unittest discover -s tests -v
