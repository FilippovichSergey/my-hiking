# Галоўныя налады праекта «Мае паходы»

# Тэчка з фота і відэа. Кожны паход ляжыць у падтэчцы выгляду
# ГГГГММДД_Назва або ГГГГММДД-ДД_Назва. Для сайта бяруцца толькі фота
# з падтэчкі паходу з адной з гэтых назваў (першая знойдзеная).
photos_root: "F:/Фота і відэа"
site_photos_subfolders: ["Сайт", "для сайту"]

komoot_user_id: "3489698636609"
# Віды спорту Komoot, якія лічацца хайкінгам. Астатнія туры ігнаруюцца.
komoot_sports: [hike, mountaineering]

youtube_channel: "https://www.youtube.com/@vlog_belarusa"

# Часавы пояс па змаўчанні (Грузія = UTC+4), каб правільна вызначаць дату тура.
default_utc_offset: 4

photo:
  max_size: 2000       # даўжэйшы бок вялікага фота, px
  quality: 80          # якасць WebP
  thumb_size: 640      # даўжэйшы бок мініяцюры, px
  thumb_quality: 72
