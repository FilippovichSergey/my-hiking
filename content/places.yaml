# Свае назвы населеных пунктаў каля старту і фінішу.
#
# Назвы бяруцца з OpenStreetMap (`hike fetch`). Беларускай назвы там часта няма, і сайт паказвае англійскую.
# Тут можна напісаць сваю: злева — назва, якую сайт паказвае па-англійску, справа — беларуская назва.
# Калі трэба паправіць і рускую: {be: "…", ru: "…"}. Пасля змены — `hike build`.
# Якіх назваў тут яшчэ няма, паказвае `hike status`.

